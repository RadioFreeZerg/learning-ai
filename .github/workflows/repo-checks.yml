# Runs the checks from the BASE branch against the pull request's files.
# The pull request content is only read as data; its scripts are never run.
# No secrets, read-only token, no third-party actions.
#
# LIMIT: on `pull_request`, GitHub runs THIS workflow file from the pull
# request itself, so a pull request can replace or weaken it and still get a
# green check. This check catches mistakes; it is not a trust boundary. Any
# change under .github/ or scripts/ must be reviewed by a human.
name: repo-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get checks from the base branch and the PR files as data
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BASE_REF" "https://github.com/$REPO" base
          git clone --depth 1 "https://github.com/$REPO" pr
          git -C pr fetch --depth 1 origin "pull/$PR_NUMBER/head"
          git -C pr checkout --quiet FETCH_HEAD
      - name: Run checks
        run: |
          if [ ! -f base/scripts/check_repo.py ]; then
            echo "::notice::scripts/check_repo.py is not on the base branch yet; skipping."
            exit 0
          fi
          python3 -I base/scripts/check_repo.py pr
